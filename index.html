<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro Tuner — Professional Chromatic Instrument Tuner</title>
    <meta name="description"
        content="Free professional chromatic tuner for guitar, bass, ukulele, violin and more. PWA with offline support, strobe meter, and ±0.5 cent accuracy.">
    <!-- Open Graph -->
    <meta property="og:title" content="Pro Tuner — Professional Chromatic Instrument Tuner">
    <meta property="og:description" content="Free, ad-free professional chromatic tuner for guitar, bass, ukulele, violin and more. Works offline. ±0.5 cent accuracy.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tuner.schoensgibl.com">
    <meta property="og:site_name" content="Pro Tuner">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://tuner.schoensgibl.com/icons/og-image.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Pro Tuner — Professional Chromatic Instrument Tuner">
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pro Tuner — Professional Chromatic Instrument Tuner">
    <meta name="twitter:description" content="Free, ad-free chromatic tuner for any string instrument. Offline PWA. ±0.5¢ accuracy.">
    <meta name="twitter:image" content="https://tuner.schoensgibl.com/icons/og-image.svg">
    <meta name="twitter:image:alt" content="Pro Tuner app preview">
    <!-- PWA / Theme -->
    <meta name="theme-color" content="#e8a838">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pro Tuner">
    <!-- Canonical -->
    <link rel="canonical" href="https://tuner.schoensgibl.com">
    <link rel="manifest" href="/manifest.json">
    <!-- Favicons -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/icons/icon-192.png" sizes="192x192">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <h1 class="header__title">PRO TUNER</h1>
            <p class="header__subtitle">Professional Chromatic</p>
            <div class="header__actions">
                <button class="btn-icon" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <button class="btn-icon" id="settingsToggle" aria-label="Open settings" title="Settings" aria-haspopup="dialog" aria-controls="settingsPanel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Instrument & Tuning Selector -->
        <section class="selector" aria-label="Instrument and tuning selection">
            <button class="selector__toggle" id="selectorToggle" aria-expanded="false" aria-controls="selectorPanel">
                <span id="selectorLabel">Instrument &amp; Tuning</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9" />
                </svg>
            </button>
            <div class="selector__panel" id="selectorPanel" hidden>
                <div class="selector__instruments" id="instrumentSelector" role="tablist" aria-label="Instrument"></div>
                <div class="selector__tunings" id="tuningSelector" role="tablist" aria-label="Tuning"></div>
            </div>
        </section>

        <!-- Power Button -->
        <div class="power-section">
            <button class="power-btn" id="powerBtn" aria-label="Toggle tuner on/off">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <line x1="12" y1="2" x2="12" y2="12" />
                    <path d="M16.24 7.76a6 6 0 1 1-8.48 0" />
                </svg>
                <span>POWER</span>
            </button>
        </div>

        <!-- Note Display -->
        <section class="note-display" aria-live="polite" aria-label="Detected pitch">
            <div class="note-display__note" id="detectedNote">—</div>
            <div class="note-display__octave" id="detectedOctave"></div>
            <div class="note-display__frequency" id="frequency">— Hz</div>
            <div class="note-display__cents" id="cents">— cent</div>
        </section>

        <!-- Tuning Meter -->
        <section class="meter-section" aria-label="Tuning meter">
            <div class="meter-container">
                <canvas id="meterCanvas" aria-hidden="true"></canvas>
            </div>
            <div class="input-level">
                <div class="input-level__bar">
                    <div class="input-level__fill" id="inputLevel"></div>
                </div>
                <div class="input-level__labels">
                    <span>MIN</span>
                    <span>INPUT LEVEL</span>
                    <span>MAX</span>
                </div>
            </div>
        </section>

        <!-- Visualizations -->
        <section class="visualization-section" aria-label="Signal visualizations">
            <button class="visualization-toggle" id="visualizationToggle" aria-expanded="false" aria-controls="visualizationPanel">
                <span>Signal Scope</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9" />
                </svg>
            </button>
            <div class="visualization-panel" id="visualizationPanel" hidden>
                <div class="visualization-card">
                    <div class="visualization-card__label">Waveform</div>
                    <canvas id="waveformCanvas" class="visualization-canvas" aria-hidden="true"></canvas>
                </div>
                <div class="visualization-card">
                    <div class="visualization-card__label">Pitch History</div>
                    <canvas id="pitchHistoryCanvas" class="visualization-canvas" aria-hidden="true"></canvas>
                </div>
            </div>
        </section>

        <!-- String Cards -->
        <section class="strings" aria-label="Tuning strings">
            <div class="strings__grid" id="stringDisplay" role="group"></div>
            <div class="strings__hint" id="stringHint">Tap a string to hear its reference tone</div>
        </section>

        <!-- Status Bar -->
        <footer class="status-bar" aria-live="polite">
            <div class="status-bar__text" id="status">Press power to start</div>
        </footer>

        <!-- Settings Panel (slide-in) -->
        <div class="settings-overlay" id="settingsOverlay" hidden></div>
        <aside class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1" hidden>
            <div class="settings-panel__header">
                <h2 id="settingsTitle">Settings</h2>
                <button class="btn-icon" id="settingsClose" aria-label="Close settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="settings-panel__body">
                <div class="setting-group">
                    <label class="setting-label">A4 Reference Pitch</label>
                    <div class="setting-a4">
                        <button class="setting-a4__btn" id="a4Minus" aria-label="Decrease A4">−</button>
                        <input type="number" class="setting-a4__input" id="a4Input" value="440" min="430" max="450"
                            aria-label="A4 frequency in Hz">
                        <span class="setting-a4__unit">Hz</span>
                        <button class="setting-a4__btn" id="a4Plus" aria-label="Increase A4">+</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Sensitivity</label>
                    <div class="setting-toggle" role="radiogroup" aria-label="Sensitivity">
                        <button class="setting-toggle__btn" data-value="low" role="radio"
                            aria-checked="false">Low</button>
                        <button class="setting-toggle__btn active" data-value="medium" role="radio"
                            aria-checked="true">Medium</button>
                        <button class="setting-toggle__btn" data-value="high" role="radio"
                            aria-checked="false">High</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Meter Style</label>
                    <div class="setting-toggle" role="radiogroup" aria-label="Meter style">
                        <button class="setting-toggle__btn active" data-value="needle" role="radio"
                            aria-checked="true">Needle</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Notation</label>
                    <div class="setting-toggle" role="radiogroup" aria-label="Notation preference">
                        <button class="setting-toggle__btn active" data-value="sharp" role="radio"
                            aria-checked="true">Sharp ♯</button>
                        <button class="setting-toggle__btn" data-value="flat" role="radio"
                            aria-checked="false">Flat ♭</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Transposition</label>
                    <div class="setting-select">
                        <select id="transposition" aria-label="Transposition in semitones">
                            <option value="0" selected>None (Concert)</option>
                            <option value="-1">-1 Semitone</option>
                            <option value="-2">-2 Semitones</option>
                            <option value="-3">-3 Semitones</option>
                            <option value="-4">-4 Semitones</option>
                            <option value="-5">-5 Semitones</option>
                            <option value="-6">-6 Semitones</option>
                        </select>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>

</html>
